<meta charset="utf-8"><title>Buildings test</title>
<style>html,body{margin:0;height:100%;background:#cfe3f0}canvas{display:block}</style>
<script id="world" type="application/json">__WORLD__</script>
<script>/*__HP_BUILDINGS__*/</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
const W = JSON.parse(document.getElementById('world').textContent);
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); r.setPixelRatio(devicePixelRatio); document.body.append(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfe3f0);
const cam = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 5, 20000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x887766, 1.1)); const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(1500, 2500, 1200); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000,6000).rotateX(-Math.PI/2), new THREE.MeshLambertMaterial({color:0xd9cdb3})); scene.add(ground);
const geoms = []; const t0 = performance.now(); let bad = 0;
W.buildings.forEach((b,i) => { try { const g = HPBuildings.geometry(THREE, b, i); const st = HPBuildings.style(b,i); const n = g.attributes.position.count; const c = new Float32Array(n*3); const col = st.col || (b.h > 60 ? [0.45,0.6,0.72] : [0.85,0.8,0.7]); for (let k=0;k<n;k++) c.set(g.attributes.aCrown.array[k] ? [1,0.9,0.6] : col, k*3); g.setAttribute('color', new THREE.BufferAttribute(c,3)); geoms.push(g); } catch(e) { bad++; console.error(b.n||i, e.message); } });
const g = mergeGeometries(geoms.map(x => { x.deleteAttribute('aCrown'); return x; }));
scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors:true, roughness:.8})));
window.info = { ms: Math.round(performance.now()-t0), verts: g.attributes.position.count, bad };
const view = (x,z,y,d,az=0.7,el=0.5) => { cam.position.set(x + d*Math.cos(el)*Math.sin(az), y + d*Math.sin(el), z + d*Math.cos(el)*Math.cos(az)); cam.lookAt(x,y,z); r.render(scene,cam); };
window.view = view; const L = (n) => W.buildings.find(b=>b.n===n);
window.go = (n, d=420, y=110, az=0.7, el=0.35) => { const b = L(n); view(b.c[0], b.c[1], y, d, az, el); };
view(0,0,0,2800,0.62,0.75);
</script>
