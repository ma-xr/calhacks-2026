<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CommonGround · Video Deck</title>
<!--
  Deck for recording the CommonGround video with live narration. Served by ./run.sh at /video/,
  next to the 3D app, so each slide can drive the real app (same origin, window.__bw).
  → / PageDown / Space next · ← / PageUp back · P presenter window · F fullscreen · B black · M manual builds
  ?snapshot  replay saved engine results (no engine needed) · ?wpm=150  narration pace · ?slide=7  start at a slide
  ?presenter  the narrator's window (opened with P)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050b16; --panel: rgba(9, 17, 31, .74); --line: rgba(255, 255, 255, .12);
  --fg: #f3f7fc; --dim: #a9bad1; --mute: #7b8fab;
  --accent: #3b9cff; --hi: #7fd3ff; --car: #27c4ff; --walk: #ffad1f; --social: #ff4fa3; --good: #4fdc7a; --bad: #ff5d5d; --edit: #b46cff; --warn: #ffd23a;
  --u: min(1vw, 1.7778vh);
  --f: "Inter", "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; color: var(--fg); font-family: var(--f); overflow: hidden; -webkit-font-smoothing: antialiased; }
body.idle:not(.interactive), body.idle:not(.interactive) * { cursor: none !important; }

/* ── stage and layers ── */
#stage { position: fixed; inset: 0; background: var(--bg); overflow: hidden; }
.layer { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .9s ease, transform 1.2s var(--ease); }
.layer.on { opacity: 1; pointer-events: auto; }
.layer iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
#L-app { transform-origin: 0 0; overflow: hidden; }
#L-app iframe { transition: filter .9s ease; }
#L-app.dim iframe { filter: brightness(.34) saturate(.7) blur(2px); }
#L-app.soft iframe { filter: brightness(.62) saturate(.85); }
#L-app.panel { transform: translate(3.5%, 25%) scale(.29); border-radius: calc(var(--u) * 4.2); box-shadow: 0 0 0 calc(var(--u) * .5) rgba(255, 255, 255, .14); }
#L-app.panel.up { transform: translate(3.5%, 7%) scale(.29); }
#pins { position: absolute; inset: 0; pointer-events: none; }
.pin { position: absolute; transform: translate(-50%, calc(-100% - var(--u) * 1.2)); white-space: nowrap; font-weight: 800; font-size: calc(var(--u) * 1.55); letter-spacing: -.01em;
  padding: calc(var(--u) * .55) calc(var(--u) * 1.1); border-radius: calc(var(--u) * 5); background: rgba(5, 11, 22, .82); border: 1px solid var(--line); backdrop-filter: blur(10px);
  opacity: 0; transition: opacity .5s ease; display: flex; align-items: center; gap: calc(var(--u) * .6); }
.pin.in { opacity: 1; }
.pin::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: calc(var(--u) * 1.2); background: rgba(255, 255, 255, .5); }
.pin i { width: calc(var(--u) * .8); height: calc(var(--u) * .8); border-radius: 50%; background: currentColor; flex: none; }
.pin.walk { color: var(--walk); } .pin.car { color: var(--car); } .pin.bad { color: #ff8b8b; } .pin b { color: var(--fg); font-weight: 800; }
#L-cities .cpanel { position: absolute; top: 25%; width: 29%; height: 29%; border-radius: calc(var(--u) * 1.2); overflow: hidden; opacity: 0; transform: translateY(calc(var(--u) * 2));
  transition: opacity .8s ease, transform 1.2s var(--ease), top 1.2s var(--ease); box-shadow: 0 0 0 calc(var(--u) * .15) rgba(255, 255, 255, .14); background: var(--bg); }
#L-cities .cpanel.in { opacity: 1; transform: none; }
#L-cities.up .cpanel { top: 7%; }

/* ── overlays ── */
#ov { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.slide { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease; }
.slide.on { opacity: 1; }
.slide.off { opacity: 0; transition-duration: .5s; }
.rv { opacity: 0; transform: translateY(calc(var(--u) * 1.6)); filter: blur(10px); transition: opacity .8s ease, transform 1s var(--ease), filter .8s ease; }
.rv.in { opacity: 1; transform: none; filter: none; }
.vignette { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, transparent 45%, rgba(0, 0, 0, .55)); }
.shade-b { position: absolute; inset: 0; background: linear-gradient(transparent 52%, rgba(0, 0, 0, .62)); }
.shade-l { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(3, 8, 16, .72), transparent 42%); }
.glass { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); border-radius: calc(var(--u) * 1.6); }
.eyebrow { font-size: calc(var(--u) * 1.15); letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: var(--dim); }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* 1 · hook */
.trio { position: absolute; left: 6%; bottom: 11%; display: flex; gap: calc(var(--u) * 3.4); font-size: calc(var(--u) * 7.4); font-weight: 850; letter-spacing: -.04em; }
.trio span { opacity: 0; transform: translateY(calc(var(--u) * 2)); filter: blur(12px); transition: opacity .9s ease, transform 1.1s var(--ease), filter .9s ease; text-shadow: 0 calc(var(--u) * .4) calc(var(--u) * 3) rgba(0, 0, 0, .5); }
.trio span.in { opacity: 1; transform: none; filter: none; }
.trio span:nth-child(1) { color: var(--social); } .trio span:nth-child(2) { color: var(--walk); } .trio span:nth-child(3) { color: var(--hi); }

/* 2 · Ditmars */
.s-ditmars { background: var(--bg); }
.s-ditmars svg.street { position: absolute; inset: 0; width: 100%; height: 100%; }
.s-ditmars .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.08); transition: opacity 1.6s ease, transform 14s linear; }
.s-ditmars.open .photo { opacity: .92; transform: scale(1); }
.s-ditmars .photo + .fade { position: absolute; inset: 0; background: linear-gradient(transparent 40%, rgba(5, 11, 22, .85)); opacity: 0; transition: opacity 1.6s; }
.s-ditmars.open .photo + .fade { opacity: 1; }
.street .asph { fill: #182131; transition: fill 1.4s ease; }
.open .street .asph { fill: #3a3128; }
.street .walkway { fill: #222c3d; transition: fill 1.4s ease; }
.open .street .walkway { fill: #463a2e; }
.street .bld { fill: #121b2a; stroke: rgba(255, 255, 255, .05); }
.street .awn { opacity: .32; transition: opacity 1.4s ease; }
.open .street .awn { opacity: .95; }
.street .lane { stroke: rgba(255, 255, 255, .5); stroke-width: 4; stroke-dasharray: 34 30; transition: opacity 1s; }
.open .street .lane { opacity: 0; }
.street .car { animation: drive var(--dur) linear infinite; animation-delay: var(--del); transition: opacity .9s ease; }
.street .car.rev { animation-direction: reverse; }
.open .street .car { opacity: 0; }
@keyframes drive { from { transform: translateX(-220px); } to { transform: translateX(1820px); } }
.street .tbl { opacity: 0; transform: scale(.2); transform-box: fill-box; transform-origin: center; transition: opacity .6s ease, transform .8s var(--ease); transition-delay: var(--d); }
.open .street .tbl { opacity: 1; transform: none; }
.street .ppl { opacity: 0; transition: opacity .8s ease; transition-delay: var(--d); animation: drift var(--t) ease-in-out infinite alternate; }
.open .street .ppl { opacity: 1; }
@keyframes drift { to { transform: translate(var(--dx), var(--dy)); } }
.street .arc { fill: none; stroke: var(--social); stroke-width: 3; stroke-linecap: round; opacity: .9; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); transition: stroke-dashoffset 1.4s var(--ease); transition-delay: var(--d); filter: drop-shadow(0 0 6px rgba(255, 79, 163, .7)); }
.gather .street .arc { stroke-dashoffset: 0; }
.place { position: absolute; left: 5%; top: 7%; }
.place b { display: block; font-size: calc(var(--u) * 3.6); font-weight: 850; letter-spacing: -.03em; }
.place span { display: block; margin-top: calc(var(--u) * .4); font-size: calc(var(--u) * 1.7); color: var(--dim); font-weight: 600; }
.stat44 { position: absolute; right: 5%; bottom: 8%; text-align: right; }
.stat44 b { display: block; font-size: calc(var(--u) * 15); font-weight: 900; letter-spacing: -.05em; line-height: .9; color: var(--good); text-shadow: 0 0 calc(var(--u) * 5) rgba(79, 220, 122, .35); font-variant-numeric: tabular-nums; }
.stat44 span { display: block; margin-top: calc(var(--u) * .8); }
.stat44 small { display: block; margin-top: calc(var(--u) * .5); font-size: calc(var(--u) * 1); color: var(--mute); letter-spacing: .04em; }

/* 3–4 · months, minutes */
.s-months, .s-minutes { background: radial-gradient(90% 80% at 50% 45%, #0c1a30, var(--bg)); }
.cal { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); display: grid; grid-template-columns: repeat(12, calc(var(--u) * 5.3)); gap: calc(var(--u) * 1); }
.cal i { height: calc(var(--u) * 5.3); border-radius: calc(var(--u) * .9); border: 1px solid rgba(255, 255, 255, .13); background: rgba(255, 255, 255, .025);
  transition: background .5s ease, box-shadow .5s ease, border-color .5s ease, transform 1s var(--ease), opacity .8s ease; }
.cal i.on { background: linear-gradient(160deg, #ffc35a, #ff7a1f); border-color: transparent; box-shadow: 0 0 calc(var(--u) * 2) rgba(255, 140, 40, .45); }
.bigword { position: absolute; left: 0; right: 0; top: 17%; text-align: center; font-size: calc(var(--u) * 9); font-weight: 900; letter-spacing: -.05em; height: calc(var(--u) * 11); }
.bigword span { position: absolute; left: 0; right: 0; opacity: 0; transform: translateY(calc(var(--u) * 2)); filter: blur(12px); transition: opacity .7s ease, transform .9s var(--ease), filter .7s ease; }
.bigword span.in { opacity: 1; transform: none; filter: none; }
.bigword span.gone { opacity: 0; transform: translateY(calc(var(--u) * -2)); filter: blur(12px); }
.watch { position: absolute; left: 50%; top: 47%; width: calc(var(--u) * 26); height: calc(var(--u) * 26); transform: translate(-50%, -50%); opacity: 0; transition: opacity .8s ease; }
.watch.in { opacity: 1; }
.watch .ring { stroke: var(--hi); stroke-width: 9; fill: none; stroke-linecap: round; stroke-dasharray: 566; stroke-dashoffset: 566; transform: rotate(-90deg); transform-origin: 100px 110px; transition: stroke-dashoffset 1.6s var(--ease); filter: drop-shadow(0 0 10px rgba(127, 211, 255, .6)); }
.watch.in .ring { stroke-dashoffset: 0; }
.watch .hand { transform-origin: 100px 110px; transform: rotate(0deg); transition: transform 1.6s var(--ease); }
.watch.in .hand { transform: rotate(360deg); }
.minword { position: absolute; left: 0; right: 0; top: 75%; text-align: center; font-size: calc(var(--u) * 8); font-weight: 900; letter-spacing: -.05em; color: var(--hi); }

/* 5 · intro */
.lockup { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: calc(var(--u) * 2.6); transition: opacity 1s ease, transform 1.6s var(--ease), filter 1s; }
.lockup.gone { opacity: 0; transform: translate(-50%, -50%) scale(1.5); filter: blur(14px); }
.logo { width: calc(var(--u) * 11); height: calc(var(--u) * 11); border-radius: 26%; background: linear-gradient(150deg, #4aa8ff, #1d5fd6); display: grid; place-items: center; box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 5) rgba(29, 95, 214, .55), inset 0 1px 0 rgba(255, 255, 255, .35); }
.logo svg { width: 64%; height: 64%; fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; }
.wordmark { font-size: calc(var(--u) * 9); font-weight: 850; letter-spacing: -.045em; text-shadow: 0 calc(var(--u) * .5) calc(var(--u) * 4) rgba(0, 0, 0, .55); }
.lockup .logo { opacity: 0; transform: scale(.6) rotate(-12deg); transition: opacity .8s ease, transform 1.1s var(--ease); }
.lockup .wordmark { opacity: 0; transform: translateX(calc(var(--u) * -2)); filter: blur(10px); transition: opacity .9s ease .25s, transform 1.1s var(--ease) .25s, filter .9s ease .25s; }
.lockup.in .logo, .lockup.in .wordmark { opacity: 1; transform: none; filter: none; }

/* 6 · data */
.peoplecount { position: absolute; left: 5%; top: 8%; }
.peoplecount b { display: block; font-size: calc(var(--u) * 8.4); font-weight: 900; letter-spacing: -.05em; line-height: .95; font-variant-numeric: tabular-nums; }
.peoplecount span { display: block; margin-top: calc(var(--u) * .6); }
.rail { position: absolute; left: 5%; top: 31%; display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--u) * 1); }
.src { display: flex; align-items: center; gap: calc(var(--u) * 1.2); padding: calc(var(--u) * .6) calc(var(--u) * 1.6) calc(var(--u) * .6) calc(var(--u) * .6); }
.src svg { width: calc(var(--u) * 3.6); height: calc(var(--u) * 3.6); flex: none; }
.src b { font-size: calc(var(--u) * 1.9); font-weight: 800; letter-spacing: -.02em; }
.src em { font-style: normal; font-size: calc(var(--u) * 1.4); color: var(--dim); font-weight: 600; margin-left: calc(var(--u) * .6); }
.src.in { transition: opacity .6s ease, transform .9s var(--ease), filter .6s ease; }
.rail.has-cur .src.in:not(.cur) { opacity: .5; }
.apify { display: inline-flex; align-items: center; gap: calc(var(--u) * .5); margin-left: calc(var(--u) * .8); padding: calc(var(--u) * .25) calc(var(--u) * .8); border-radius: calc(var(--u) * 3); background: rgba(151, 215, 0, .16); color: #b9ee3c; font-size: calc(var(--u) * 1.35); font-weight: 800; opacity: 0; transform: scale(.8); transition: opacity .5s, transform .6s var(--ease); }
.apify.in { opacity: 1; transform: none; }

/* 7 · rush hour chart */
.chart { position: absolute; right: 4%; bottom: 7%; width: calc(var(--u) * 38); padding: calc(var(--u) * 1.8) calc(var(--u) * 2) calc(var(--u) * 1.4); }
.chart .top { display: flex; justify-content: space-between; align-items: baseline; gap: calc(var(--u) * 2); white-space: nowrap; }
.chart .r { font-size: calc(var(--u) * 3.2); font-weight: 900; letter-spacing: -.03em; color: var(--hi); }
.chart svg { width: 100%; height: auto; display: block; margin-top: calc(var(--u) * .8); overflow: visible; }
.chart .model { fill: none; stroke: var(--hi); stroke-width: 3.2; stroke-dasharray: 1400; stroke-dashoffset: 1400; transition: stroke-dashoffset 1.8s var(--ease) .2s; }
.chart .bart { fill: none; stroke: rgba(255, 255, 255, .85); stroke-width: 2.4; stroke-dasharray: 7 6; opacity: 0; transition: opacity .8s ease .9s; }
.chart.in .model { stroke-dashoffset: 0; } .chart.in .bart { opacity: 1; }
.chart .area { fill: url(#gArea); opacity: 0; transition: opacity 1s ease .8s; }
.chart.in .area { opacity: 1; }
.chart text { fill: var(--mute); font-size: 13px; font-family: var(--f); font-weight: 600; }
.chart .key { display: flex; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * .6); font-size: calc(var(--u) * 1.3); font-weight: 700; color: var(--dim); }
.chart .key i { display: inline-block; width: calc(var(--u) * 2.2); height: 3px; vertical-align: middle; margin-right: calc(var(--u) * .6); border-radius: 2px; }

/* 9 · effects chips */
.chips { position: absolute; left: 4%; bottom: 8%; display: flex; flex-direction: column; gap: calc(var(--u) * 1.2); }
.fx { display: flex; align-items: center; gap: calc(var(--u) * 1.4); padding: calc(var(--u) * 1.2) calc(var(--u) * 2.2) calc(var(--u) * 1.2) calc(var(--u) * 1.3); }
.fx .ico { width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); border-radius: 30%; display: grid; place-items: center; font-size: calc(var(--u) * 2.5); flex: none; }
.fx b { display: block; font-size: calc(var(--u) * 3.8); font-weight: 900; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.fx span { display: block; margin-top: calc(var(--u) * .35); font-size: calc(var(--u) * 1.35); font-weight: 700; color: var(--dim); letter-spacing: .02em; }
.fx.walk .ico { background: rgba(255, 173, 31, .18); color: var(--walk); } .fx.walk b { color: var(--walk); }
.fx.money .ico { background: rgba(79, 220, 122, .16); color: var(--good); } .fx.money b { color: var(--good); }
.fx.car .ico { background: rgba(255, 93, 93, .16); color: #ff8b8b; } .fx.car b { color: #ff8b8b; }

/* 10 · follow */
.who { position: absolute; left: 50%; bottom: 8%; translate: -50% 0; display: flex; align-items: center; gap: calc(var(--u) * 2.2); padding: calc(var(--u) * 1.4) calc(var(--u) * 2.8) calc(var(--u) * 1.4) calc(var(--u) * 1.6); }
.who .av { width: calc(var(--u) * 5.2); height: calc(var(--u) * 5.2); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe08a, #ffad1f 60%, #c97a00); display: grid; place-items: center; font-weight: 900; font-size: calc(var(--u) * 2.4); color: #3a2400; box-shadow: 0 0 0 calc(var(--u) * .35) rgba(255, 194, 58, .35); }
.who .nm { font-size: calc(var(--u) * 3); font-weight: 850; letter-spacing: -.03em; }
.who .modes { display: flex; align-items: center; gap: calc(var(--u) * 1.4); font-size: calc(var(--u) * 4.2); }
.who .m0 { color: var(--car); position: relative; opacity: .8; }
.who .m0::after { content: ""; position: absolute; left: -8%; right: -8%; top: 50%; height: calc(var(--u) * .45); border-radius: 9px; background: var(--bad); transform: rotate(-28deg) scaleX(0); transition: transform .5s var(--ease) .5s; }
.who.in .m0::after { transform: rotate(-28deg) scaleX(1); }
.who .arrow { font-size: calc(var(--u) * 2.4); color: var(--mute); }
.who .m1 { color: var(--hi); opacity: 0; transform: scale(.6); transition: opacity .5s ease 1s, transform .7s var(--ease) 1s; }
.who.in .m1 { opacity: 1; transform: none; }

/* 11 · policies */
.tiles { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; grid-template-columns: repeat(3, calc(var(--u) * 21)); gap: calc(var(--u) * 1.6); }
.tile { padding: calc(var(--u) * 1.9) calc(var(--u) * 1.8); display: flex; align-items: center; gap: calc(var(--u) * 1.4); opacity: 0; transform: translateY(calc(var(--u) * 2)) scale(.94); transition: opacity .6s ease, transform .9s var(--ease); transition-delay: var(--d); }
.tiles.in .tile { opacity: 1; transform: none; }
.tile .ico { width: calc(var(--u) * 4.6); height: calc(var(--u) * 4.6); border-radius: 28%; display: grid; place-items: center; font-size: calc(var(--u) * 2.7); background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); flex: none; }
.tile b { font-size: calc(var(--u) * 1.95); font-weight: 800; letter-spacing: -.02em; }

/* 12 · Droid */
.droid { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: calc(var(--u) * 68); padding: calc(var(--u) * 2.2) calc(var(--u) * 2.6) calc(var(--u) * 2.4); }
.droid .hd { display: flex; align-items: center; gap: calc(var(--u) * 1); font-weight: 800; font-size: calc(var(--u) * 1.7); }
.droid .hd .dg { width: calc(var(--u) * 3); height: calc(var(--u) * 3); border-radius: 26%; background: #f5f1ea; display: grid; place-items: center; }
.droid .hd .dg svg { width: 62%; height: 62%; fill: none; stroke: #111; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.droid .hd small { margin-left: auto; font-size: calc(var(--u) * 1.15); color: var(--mute); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.bubble { margin-top: calc(var(--u) * 1.6); display: inline-block; padding: calc(var(--u) * 1) calc(var(--u) * 1.6); border-radius: calc(var(--u) * 1.4) calc(var(--u) * 1.4) calc(var(--u) * 1.4) calc(var(--u) * .3); background: rgba(59, 156, 255, .18); border: 1px solid rgba(127, 211, 255, .3); font-size: calc(var(--u) * 2); font-weight: 700; }
.code { margin-top: calc(var(--u) * 1.6); padding: calc(var(--u) * 1.4) calc(var(--u) * 1.6); border-radius: calc(var(--u) * 1); background: rgba(0, 0, 0, .45); border: 1px solid var(--line); font-family: var(--mono); font-size: calc(var(--u) * 1.32); line-height: 1.65; min-height: calc(var(--u) * 16); white-space: pre; color: #dbe6f5; overflow: hidden; }
.code .ln { display: block; opacity: 0; transform: translateX(calc(var(--u) * -1)); transition: opacity .25s ease, transform .35s var(--ease); }
.code .ln.in { opacity: 1; transform: none; }
.code .ln::before { content: "+ "; color: var(--good); }
.code .k { color: #ff7ab6; } .code .s { color: #9be58a; } .code .n { color: var(--warn); } .code .fn { color: var(--hi); }
.gates { margin-top: calc(var(--u) * 1.4); display: flex; flex-wrap: wrap; gap: calc(var(--u) * .7); }
.gates span { padding: calc(var(--u) * .45) calc(var(--u) * 1); border-radius: calc(var(--u) * 3); font-size: calc(var(--u) * 1.3); font-weight: 800; background: rgba(255, 255, 255, .06); color: var(--mute); border: 1px solid var(--line); transition: background .3s, color .3s, border-color .3s; }

    const rev = i % 2 === 1, y = rev ? 466 : 400;
    s += `<g class="car${rev ? ' rev' : ''}" style="--dur:${(7 + R() * 3).toFixed(1)}s;--del:-${(R() * 9).toFixed(1)}s"><rect x="0" y="${y}" width="74" height="34" rx="9" fill="#27c4ff"/><rect x="${rev ? 8 : 40}" y="${y + 6}" width="24" height="22" rx="5" fill="#0b2840" opacity=".7"/></g>`;
  }
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const x = 120 + i * 150 + R() * 30, y = i % 2 ? 478 : 424, d = (.15 + i * .08).toFixed(2);
    s += `<g class="tbl" style="--d:${d}s"><circle cx="${x}" cy="${y}" r="15" fill="#2c3647" stroke="#ffd8a8" stroke-width="2"/>`;
    for (const [dx, dy] of [[-24, 0], [24, 0], [0, -24], [0, 24]]) s += `<circle cx="${x + dx}" cy="${y + dy}" r="5" fill="#ffd8a8" opacity=".7"/>`;
    s += '</g>';
  }
  for (let i = 0; i < 90; i++) {
    const x = 30 + R() * 1540, y = 350 + R() * 200, d = (.3 + R() * 1.4).toFixed(2);
    pts.push([x, y]);
    s += `<circle class="ppl" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(5 + R() * 2).toFixed(1)}" fill="#ffad1f" style="--d:${d}s;--t:${(2.5 + R() * 3).toFixed(1)}s;--dx:${(R() * 16 - 8).toFixed(0)}px;--dy:${(R() * 10 - 5).toFixed(0)}px"/>`;
  }
  let n = 0;
  for (let i = 0; i < pts.length && n < 22; i += 3) {
    const a = pts[i]; let best = null;
    for (let j = 0; j < pts.length; j++) { if (j === i) continue; const dd = Math.hypot(pts[j][0] - a[0], pts[j][1] - a[1]); if (dd > 60 && dd < 190 && (!best || dd < best.dd)) best = { b: pts[j], dd }; }
    if (!best) continue; const b = best.b, mx = (a[0] + b[0]) / 2, my = Math.min(a[1], b[1]) - 26 - best.dd * .18, len = Math.round(best.dd * 1.35);
    s += `<path class="arc" d="M${a[0].toFixed(0)} ${a[1].toFixed(0)} Q${mx.toFixed(0)} ${my.toFixed(0)} ${b[0].toFixed(0)} ${b[1].toFixed(0)}" style="--len:${len};--d:${(n * .06).toFixed(2)}s"/>`; n++;

}
function smoothPath(pts) {
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }

}
function chartSVG() {
  const W = 560, H = 200, px = 10, py = 12, h0 = 4, h1 = 23, mx = Math.max(...MODEL_H, ...BART_H);
  const X = (h) => px + (h - h0) / (h1 - h0) * (W - 2 * px), Y = (v) => H - 26 - (v / mx) * (H - 26 - py);
  const series = (a) => { const out = []; for (let h = h0; h <= h1; h++) out.push([X(h), Y(a[h])]); return out; };
  const m = series(MODEL_H), b = series(BART_H), mp = smoothPath(m);
  const ticks = [[6, '6am'], [9, '9am'], [12, 'noon'], [17, '5pm'], [21, '9pm']].map(([h, l]) => `<text x="${X(h).toFixed(0)}" y="${H - 4}" text-anchor="middle">${l}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd3ff" stop-opacity=".35"/><stop offset="1" stop-color="#7fd3ff" stop-opacity="0"/></linearGradient></defs>
    <line x1="${px}" x2="${W - px}" y1="${H - 26}" y2="${H - 26}" stroke="rgba(255,255,255,.14)"/>
    <path class="area" d="${mp} L${m[m.length - 1][0].toFixed(1)} ${H - 26} L${m[0][0].toFixed(1)} ${H - 26}Z"/>
    <path class="bart" d="${smoothPath(b)}"/><path class="model" d="${mp}"/>${ticks}</svg>`;
}
function usMapSVG() {
  const P = (lat, lon) => [40 + (lon + 125) * Math.cos(38 * Math.PI / 180) * 19.6, 20 + (50 - lat) * 19.6];
  const homes = US.slice(0, 3).map(([, la, lo]) => P(la, lo));
  let s = '<svg viewBox="0 0 1000 560">';
  US.forEach(([name, la, lo], i) => {
    const [x, y] = P(la, lo);
    if (i < 3) { s += `<circle class="halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10"/><circle class="home" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10"/>`; return; }
    const dist = Math.min(...homes.map(([hx, hy]) => Math.hypot(hx - x, hy - y)));
    s += `<circle class="d" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.5" style="--d:${(dist / 260).toFixed(2)}s"/>`;
  });
  return s + '</svg>';
}

}

      { w: 9, run: (c) => { c.$$('.code .ln').forEach((l) => l.classList.add('in')); c.$$('.gates span').forEach((g, i) => c.later(() => g.classList.add('ok'), 200 + i * 300)); } },
      { w: 19, run: async (c) => {
        c.$$('.gates span').forEach((g) => g.classList.add('ok')); const cur = c.$('.cursor'); cur.classList.add('in'); await sleep(60); cur.style.left = '8%'; cur.style.top = '40%';
        await sleep(1050); if (!c.alive()) return; const b = c.$('.approve .btn'); b.classList.add('press'); await sleep(180); b.classList.remove('press'); b.classList.add('done'); b.textContent = 'Approved';
        await sleep(250); c.$('.approve .live').classList.add('in'); await sleep(700); cur.classList.remove('in');
      } }] },

  { id: 'workspace', sec: '3 · Together', title: 'Workspaces, live', layers: ['site'], interactive: true,
    say: 'Common Ground isn’t just a solo tool. You can collaborate with your coworkers on different urban development projects. SpacetimeDB enables everyone on the team to see each other’s edits live. [Create the project, edit a road.]',
    html: () => `<div class="livechip glass rv"><i></i>Live · SpacetimeDB</div><div class="hl"></div><span class="wcur">${ICON.pointer}</span>`,
    async enter(c) {
      A.dim(null); preloadCities(); let s = await preloadSite(); if (!c.alive()) return;
      if (!s.ok && s.why === 'spacetime') { siteP = null; s = await preloadSite(); if (!c.alive()) return; }   // one retry: SpacetimeDB may have started late
      if (!s.ok) { c.el.insertAdjacentHTML('beforeend', `<div class="missing glass">${SITE_HELP[s.why] || SITE_HELP.error}</div>`); return; }
      await tidySite(); if (!c.alive()) return;   // each take creates the plan again
      for (const t of TEAM) { const f = siteFrame(t.slot); try { f.contentWindow.location.hash = `#/w/${s.wsId}`; } catch (_) {} }
      fitWindows(); document.querySelectorAll('#L-site .win').forEach((w, i) => c.later(() => w.classList.add('in'), 100 + i * 260));
    },
    // "[Create the project, edit a road.]": Max creates the plan and makes 2nd St car-free; Aziz's board updates live.
    builds: [{ w: 10, run: (c) => sitePlanCreate(c) },
      { w: 19, run: (c) => { c.in('.livechip'); return siteHeroEdit(c); } }],
    leave() { document.querySelectorAll('#L-site .win').forEach((w) => w.classList.remove('in')); } },

  { id: 'cities', sec: '3 · Together', title: 'SF, Chicago, New York', layers: ['app', 'cities'],
    say: 'Currently, CommonGround is available for urban planners in SF, Chicago, and New York, and we’re rapidly expanding across the United States.',
    html: () => `${['San Francisco', 'Chicago', 'New York'].map((n, i) => `<div class="clabel rv" style="left:${3.5 + i * 32.25}%;top:57%">${n}</div>`).join('')}<div class="usmap">${usMapSVG()}</div>`,
    async enter() { preloadCities(); A.dim(null); A.chrome('cinema'); A.escape(); A.view('plan'); A.compare(false); A.info(null); A.time(12, 30); A.rate(60); A.play(); A.fly({ x: 90, z: 60, d: 2750, az: .62, el: .9 }, 1.6); A.orbit(.35); },
    builds: [{ w: 9, run: (c) => { $('#L-app').classList.add('panel'); c.later(() => c.in('.clabel:nth-of-type(1)'), 600); } },
      { w: 10, run: (c) => { $('#L-app').classList.add('panel'); cityFrames.chicago?.box.classList.add('in'); c.later(() => c.in('.clabel:nth-of-type(2)'), 400); } },
      { w: 12, run: (c) => { cityFrames.nyc?.box.classList.add('in'); c.later(() => c.in('.clabel:nth-of-type(3)'), 400); } },
      { w: 16, run: (c) => {
        for (const id of ['chicago', 'nyc']) cityFrames[id]?.box.classList.add('in'); c.$$('.clabel').forEach((l) => { l.classList.add('in'); l.style.top = '39%'; });
        $('#L-app').classList.add('panel', 'up'); $('#L-cities').classList.add('up'); c.in('.usmap'); c.later(() => c.$('.usmap').classList.add('grow'), 700);
      } }],
    leave() { $('#L-app').classList.remove('panel', 'up'); $('#L-cities').classList.remove('up'); setTimeout(() => { if (SLIDES[S.cur]?.id !== 'cities') dropCities(); }, 1300); } },

  { id: 'close', sec: '3 · Together', title: 'Tested in minutes', layers: ['app'],
    say: 'Cities shape who we meet, where we go, and how we live. Our goal is to make sure every change to them is a change for the better, tested in minutes instead of years.',
    html: () => `<div class="vignette"></div>${lock()}<div class="tag rv"><b>Tested in minutes,</b> not years.</div>`,
    async enter(c) {
      A.dim(null); A.chrome('cinema'); A.escape(); A.compare(false); await ensurePlan('hero'); if (!c.alive()) return; A.info('ties'); A.time(20, 20); A.rate(30); A.play();
      const h = heroMid(); await A.fly({ x: h.mx - 40, z: h.mz - 60, d: 1400, az: .62, el: .95 }, 3); if (c.alive()) A.orbit(.16);
    },
    builds: [{ w: 29, run: (c) => { c.$('.lockup').classList.add('in'); c.later(() => c.in('.tag'), 700); } }] },
];

// ───────────── deck engine ─────────────
const S = { cur: -1, tok: 0, queue: [], fired: [], enterP: null, startedAt: 0, slideAt: 0, black: false, log: [] };
const wordsOf = (say) => say.replace(/\[[^\]]*\]/g, ' ').trim().split(/\s+/).filter(Boolean).length;
const target = (s) => wordsOf(s.say) * 60 / WPM + 1.2;
function ctxFor(s, el, tok) {
  const c = {
    el, tok, alive: () => tok === S.tok, $: (q) => el.querySelector(q), $$: (q) => [...el.querySelectorAll(q)],
    in: (q) => el.querySelectorAll(q).forEach((x) => x.classList.add('in')),
    later: (fn, ms) => { const t = setTimeout(() => { if (c.alive()) fn(); }, ms); c._t.push(t); },
    every: (fn, ms) => { const t = setInterval(() => { if (c.alive()) fn(); else clearInterval(t); }, ms); c._i.push(t); },
    src: (k) => { const rail = el.querySelector('.rail'); rail.classList.add('has-cur'); el.querySelectorAll('.src').forEach((x) => x.classList.toggle('cur', x.dataset.k === k)); el.querySelector(`.src[data-k=${k}]`).classList.add('in'); },
    _t: [], _i: [],
  };
  return c;
}
function layers(s) {
  for (const k of ['app', 'cities', 'site']) $('#L-' + k).classList.toggle('on', s.layers.includes(k));
  document.body.classList.toggle('interactive', !!s.interactive);
}
function go(i) {
  if (i < 0 || i >= SLIDES.length) return;
  const prev = SLIDES[S.cur], tok = ++S.tok;
  for (const q of S.queue) clearTimeout(q.timer); S.queue = []; S.fired = [];
  if (prev) { const pc = prev._c; pc && (pc._t.forEach(clearTimeout), pc._i.forEach(clearInterval)); try { prev.leave?.(pc); } catch (e) { report(e); } }
  S.cur = i; const s = SLIDES[i]; S.slideAt = Date.now(); if (!S.startedAt) S.startedAt = Date.now();
  $('#pre').classList.add('gone'); $('#prelogo').classList.add('gone');
  for (const old of document.querySelectorAll('#ov .slide:not(.off)')) { old.classList.remove('on'); old.classList.add('off'); setTimeout(() => old.remove(), 700); }
  const el = document.createElement('div'); el.className = 'slide s-' + s.id; el.innerHTML = s.html ? s.html() : ''; $('#ov').append(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  layers(s);
  const c = ctxFor(s, el, tok); s._c = c;
  S.enterP = (async () => { try { if (s.layers.includes('app')) await app.readyP; if (tok === S.tok) await s.enter?.(c); } catch (e) { report(e); } })();
  schedule(s, c); broadcast();
}
function schedule(s, c) {
  const now = performance.now();
  S.queue = (s.builds || []).map((b, k) => ({ k, b, c, due: now + Math.max(0, (b.w - 1)) * 60000 / WPM })).sort((a, b) => a.due - b.due);
  for (const q of S.queue.slice()) { if (q.b.w <= 1) fire(q); else if (!MANUAL) q.timer = setTimeout(() => fire(q), q.due - now); }
}
async function fire(q) {
  const i = S.queue.indexOf(q); if (i < 0) return; S.queue.splice(i, 1); clearTimeout(q.timer);
  S.fired.push(q.k); broadcast();
  try { await S.enterP; if (q.c.alive()) await q.b.run(q.c); } catch (e) { report(e); }
}
function fireNext() {
  const q = S.queue[0]; if (!q) return false;
  const shift = q.due - performance.now();
  if (!MANUAL && shift > 0) for (const r of S.queue.slice(1)) { r.due -= shift; clearTimeout(r.timer); r.timer = setTimeout(() => fire(r), Math.max(0, r.due - performance.now())); }
  fire(q); return true;
}
function next() { if (S.black) return setBlack(false); if (S.cur >= 0 && fireNext()) return; if (S.cur < SLIDES.length - 1) go(S.cur + 1); else setBlack(true); }
function back() { if (S.black) return setBlack(false); if (S.cur > 0) go(S.cur - 1); }
function setBlack(on) { S.black = on; $('#black').classList.toggle('on', on); broadcast(); }
function setManual(on) { MANUAL = on; store.set('manual', on); broadcast(); }
function setWpm(v) { WPM = Math.max(100, Math.min(220, Math.round(v))); store.set('wpm', WPM); broadcast(); }
function report(e) { const msg = String(e && e.stack ? e.stack.split('\n').slice(0, 2).join(' ') : e); console.error(e); S.log.push(msg); S.log = S.log.slice(-6); broadcast(); }
function onKey(e) {
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault?.(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault?.(); back(); }
  else if (k === 'p' || k === 'P') openPresenter();
  else if (k === 'b' || k === 'B' || k === '.') setBlack(!S.black);
  else if (k === 'f' || k === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
  else if (k === 'm' || k === 'M') setManual(!MANUAL);
  else if (k === 'Home') go(0);
}
function openPresenter() { window.open(location.pathname + '?presenter', 'cg-presenter', 'width=1280,height=820'); }
function broadcast() {
  chan?.postMessage({ type: 'state', cur: S.cur, fired: S.fired, pending: S.queue.length, startedAt: S.startedAt, slideAt: S.slideAt, wpm: WPM, manual: MANUAL, black: S.black, ready: app.ready, log: S.log });
}
// Hide the cursor while recording (except on slides you click through), including inside the app frames.
let idleT = 0;
function wake() {
  document.body.classList.remove('idle'); for (const d of [app.doc]) d?.documentElement.classList.remove('deck-idle');
  clearTimeout(idleT); idleT = setTimeout(() => { document.body.classList.add('idle'); if (!SLIDES[S.cur]?.interactive) app.doc?.documentElement.classList.add('deck-idle'); }, 1800);
}
function onReady() {
  $('#pre').innerHTML = `<span class="ok">● City loaded${app.bw.B?.mode ? ' · ' + app.bw.B.mode : ''}</span> &nbsp; <kbd>→</kbd> start &nbsp; <kbd>P</kbd> presenter &nbsp; <kbd>F</kbd> fullscreen`;
  broadcast();
  const start = +QS.get('slide'); if (start >= 1 && S.cur < 0) go(Math.min(SLIDES.length, start) - 1);
}

// ───────────── presenter window ─────────────
function presenter() {
  $('#stage').remove(); $('#presenter').hidden = false; document.title = 'CommonGround · Presenter';
  let st = { cur: -1, fired: [], startedAt: 0, slideAt: 0, wpm: WPM, manual: MANUAL, ready: false, log: [] };
  const send = (cmd, extra = {}) => chan?.postMessage({ type: 'cmd', cmd, ...extra });
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  $('#p-list').innerHTML = SLIDES.map((s, i) => `<button data-i="${i}" title="${s.title}">${i + 1}</button>`).join('');
  $('#p-list').onclick = (e) => { const b = e.target.closest('button'); if (b) send('go', { i: +b.dataset.i }); };
  const render = () => {
    WPM = st.wpm; $('#p-wpm').textContent = st.wpm; $('#p-manual').classList.toggle('on', st.manual); $('#p-black').classList.toggle('on', st.black);
    $('#p-st').textContent = st.ready ? 'app ready' : 'app loading…'; $('#p-st').className = 'st ' + (st.ready ? 'ok' : 'wait');
    $('#p-log').textContent = (st.log || []).join('\n');
    $('#p-list').querySelectorAll('button').forEach((b, i) => b.classList.toggle('cur', i === st.cur));
    $('#p-ttarget').textContent = fmt(SLIDES.reduce((a, s) => a + target(s), 0));
    const s = SLIDES[st.cur];
    if (!s) { $('#p-n').textContent = '–'; $('#p-sec').textContent = 'ready'; $('#p-title').textContent = ''; $('#p-say').textContent = 'Press Next (or → in the deck) to start. The first slide is the city at dusk.'; $('#p-next').innerHTML = `<b>First:</b> ${SLIDES[0].say}`; return; }
    $('#p-n').textContent = `${st.cur + 1} / ${SLIDES.length}`; $('#p-sec').textContent = s.sec; $('#p-title').textContent = s.title; $('#p-target').textContent = fmt(target(s));
    const marks = new Map((s.builds || []).map((b, k) => [b.w, k]).filter(([w]) => w > 1));
    let n = 0;
    $('#p-say').innerHTML = s.say.split(/(\[[^\]]*\])/).map((part) => {
      if (/^\[/.test(part)) return `<span class="dir">${part}</span>`;
      return part.split(/(\s+)/).map((tok) => {
        if (!tok.trim()) return tok; n++; const k = marks.get(n);
        return k == null ? `<span class="w">${tok}</span>` : `<span class="w b${st.fired.includes(k) ? ' fired' : ''}" data-n="${[...marks.keys()].indexOf(n) + 1}">${tok}</span>`;
      }).join('');
    }).join('');
    const nx = SLIDES[st.cur + 1]; $('#p-next').innerHTML = nx ? `<b>Next · ${nx.title}:</b> ${nx.say.slice(0, 150)}${nx.say.length > 150 ? '…' : ''}` : '<b>Last slide.</b> Next fades to black.';
  };
  chan?.addEventListener('message', (e) => { if (e.data?.type === 'state') { st = e.data; render(); } });
  setInterval(() => {
    const now = Date.now(); const s = SLIDES[st.cur];
    $('#p-slide').textContent = st.slideAt ? fmt((now - st.slideAt) / 1000) : '0:00'; $('#p-total').textContent = st.startedAt ? fmt((now - st.startedAt) / 1000) : '0:00';
    $('#p-slide').classList.toggle('over', !!(s && st.slideAt && (now - st.slideAt) / 1000 > target(s) + 3));
  }, 250);
  $('#p-go').onclick = () => send('next'); $('#p-prev').onclick = () => send('back');
  $('#p-manual').onclick = () => send('manual', { on: !st.manual }); $('#p-black').onclick = () => send('black');
  $('#p-slower').onclick = () => send('wpm', { v: st.wpm - 5 }); $('#p-faster').onclick = () => send('wpm', { v: st.wpm + 5 });
  $('#p-reload').onclick = () => send('reload');
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); send('next'); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); send('back'); }
    else if (e.key === 'b' || e.key === '.') send('black');
  });
  // Mic check: a level meter so the narrator can see they're being picked up before recording.
  let mic = null;
  $('#p-mic').onclick = async () => {
    if (mic) { mic.stream.getTracks().forEach((t) => t.stop()); mic.ac.close(); mic = null; $('#p-mic').classList.remove('on'); $('#p-meter').style.width = '0'; return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); const ac = new AudioContext(); const an = ac.createAnalyser(); an.fftSize = 1024;
      ac.createMediaStreamSource(stream).connect(an); mic = { stream, ac }; $('#p-mic').classList.add('on'); const buf = new Float32Array(an.fftSize);
      const loop = () => { if (!mic) return; an.getFloatTimeDomainData(buf); let sum = 0; for (const x of buf) sum += x * x; const db = 20 * Math.log10(Math.sqrt(sum / buf.length) || 1e-8);
        const m = $('#p-meter'); m.style.width = Math.max(0, Math.min(100, (db + 60) / 60 * 100)) + '%'; m.classList.toggle('hot', db > -6); requestAnimationFrame(loop); };
      loop();
    } catch (e) { $('#p-log').textContent = 'Mic: ' + e.message; }
  };
  send('hello'); render();
}

// ───────────── boot ─────────────
if (PRESENTER) presenter();
else {
  $('#prelogo').innerHTML = `<div class="logo" style="width:72px;height:72px">${ICON.logo}</div>`;
  chan?.addEventListener('message', (e) => {
    const m = e.data; if (m?.type !== 'cmd') return;
    if (m.cmd === 'next') next(); else if (m.cmd === 'back') back(); else if (m.cmd === 'go') go(m.i);
    else if (m.cmd === 'black') setBlack(!S.black); else if (m.cmd === 'manual') setManual(m.on); else if (m.cmd === 'wpm') setWpm(m.v);
    else if (m.cmd === 'reload') { app.ready = false; unpin(); bootApp(); broadcast(); if (S.cur >= 0) app.readyP.then(() => go(S.cur)); }
    else if (m.cmd === 'hello') broadcast();
  });
  addEventListener('keydown', onKey);
  addEventListener('pointermove', wake, { passive: true });
  bootApp(); wake();
}
</script>
